name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Afficher uniquement les erreurs
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== ERREURS DE COMPILATION ====="
          grep -E "error:|^e: |FAILED|What went wrong|Unresolved reference|Expecting" build.log || echo "Aucune ligne d'erreur reconnue par le filtre — voir build.log complet dans les artifacts."

      - name: Sauvegarder le log complet en cas d'échec
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Stopper le job si le build a échoué
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Update latest-debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Latest Debug Build"
          body: "Build automatique - commit ${{ github.sha }}"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}